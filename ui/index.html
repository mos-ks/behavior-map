<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behaviour map</title>
<style>
:root {
  color-scheme: light dark;
  --bg: oklch(0.985 0.004 85); --panel: oklch(0.962 0.006 85); --raised: oklch(1 0 0);
  --line: oklch(0.89 0.008 85); --line-strong: oklch(0.80 0.01 85);
  --ink: oklch(0.24 0.012 60); --ink-2: oklch(0.44 0.012 60); --ink-3: oklch(0.52 0.012 60);
  --accent: oklch(0.46 0.13 265); --accent-ink: oklch(0.99 0 0); --accent-soft: oklch(0.93 0.035 265);
  --bad: oklch(0.50 0.17 27); --bad-soft: oklch(0.95 0.03 27); --warn: oklch(0.50 0.11 70); --good: oklch(0.45 0.10 155);
  --cat-l: 0.56; --cat-c: 0.13; --edge: oklch(0.24 0.012 60 / 0.13); --edge-strong: oklch(0.24 0.012 60 / 0.45);
  --shadow: 0 1px 2px oklch(0.2 0.02 60 / 0.06), 0 8px 24px oklch(0.2 0.02 60 / 0.08);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --r: 6px;
  --f-xs: 0.75rem; --f-s: 0.8125rem; --f-m: 0.9375rem; --f-l: 1.125rem;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.19 0.008 70); --panel: oklch(0.225 0.009 70); --raised: oklch(0.26 0.01 70);
    --line: oklch(0.31 0.01 70); --line-strong: oklch(0.42 0.012 70);
    --ink: oklch(0.94 0.008 85); --ink-2: oklch(0.78 0.01 85); --ink-3: oklch(0.68 0.01 85);
    --accent: oklch(0.78 0.11 265); --accent-ink: oklch(0.17 0.02 265); --accent-soft: oklch(0.32 0.06 265);
    --bad: oklch(0.76 0.14 27); --bad-soft: oklch(0.30 0.06 27); --warn: oklch(0.80 0.11 80); --good: oklch(0.78 0.11 155);
    --cat-l: 0.76; --cat-c: 0.115; --edge: oklch(0.94 0.008 85 / 0.13); --edge-strong: oklch(0.94 0.008 85 / 0.5);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: var(--f-m)/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden; caret-color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--ink); }
* { scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
[hidden] { display: none !important; }

/* top bar */
header { display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
h1 { font-size: var(--f-m); font-weight: 650; margin: 0; letter-spacing: -0.005em; white-space: nowrap; }
nav { display: flex; gap: 2px; }
nav button { border: 0; background: none; padding: 6px var(--s3); border-radius: var(--r); color: var(--ink-2); cursor: pointer; font-size: var(--f-s); font-weight: 550; display: flex; gap: 6px; align-items: center; }
nav button:hover { background: var(--line); color: var(--ink); }
nav button[aria-current="page"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
.count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 0.6875rem; padding: 0 6px; line-height: 1.5; font-weight: 650; }
.search { position: relative; flex: 1 1 200px; max-width: 360px; margin-left: auto; }
.search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; color: var(--ink-3); pointer-events: none; }
.search input[type=search] { width: 100%; padding: 6px 10px 6px 30px; }
input[type=text], input[type=search], input[type=password], textarea, select { background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 9px; font-size: var(--f-s); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
textarea { width: 100%; resize: vertical; line-height: 1.45; min-height: 2.4em; }
.update { display: flex; align-items: center; gap: var(--s2); font-size: var(--f-xs); }
.where { font-size: var(--f-xs); color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.where i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.where.off i { background: var(--ink-3); }

.btn { border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--r); padding: 5px var(--s3); cursor: pointer; font-size: var(--f-s); font-weight: 550; transition: background 160ms var(--ease), border-color 160ms var(--ease); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { translate: 0 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--line); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; translate: none; }
.icon-btn { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; }

/* layout */
main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
main.with-detail { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); }
.view { min-height: 0; min-width: 0; overflow: auto; position: relative; }
.pad { padding: var(--s5) var(--s5) var(--s6); }
.toolbar { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s4); }
.toolbar .spacer { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: var(--f-xs); font-weight: 550; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); background: var(--panel); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
h2 { font-size: var(--f-l); font-weight: 650; margin: var(--s6) 0 var(--s2); letter-spacing: -0.01em; }
h2:first-child { margin-top: 0; }
h3 { font-size: var(--f-xs); font-weight: 650; color: var(--ink-2); margin: var(--s5) 0 var(--s2); display: flex; align-items: center; gap: var(--s2); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
p.lead { margin: 0 0 var(--s4); color: var(--ink-2); font-size: var(--f-s); }

/* map */
#map { position: absolute; inset: 0; }
#map canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map canvas.dragging { cursor: grabbing; }
#map canvas.pointing { cursor: pointer; }
.map-tools { position: absolute; left: var(--s4); top: var(--s4); right: var(--s4); display: flex; flex-direction: column; align-items: flex-start; gap: var(--s3); pointer-events: none; }
.map-tools > * { pointer-events: auto; }
.map-tools .row { display: flex; gap: var(--s3); flex-wrap: wrap; }
.legend { width: 210px; background: color-mix(in oklch, var(--bg) 88%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s2); display: grid; gap: 1px; max-height: calc(100vh - 220px); overflow: auto; }
.legend button { border: 0; background: none; display: flex; align-items: center; gap: var(--s2); padding: 3px 6px; border-radius: 4px; font-size: var(--f-xs); cursor: pointer; text-align: left; color: var(--ink-2); }
.legend button:hover { background: var(--line); color: var(--ink); }
.legend button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.legend button span:last-child { margin-left: auto; color: var(--ink-3); }
.zoom { position: absolute; right: var(--s4); bottom: var(--s4); display: flex; gap: var(--s1); }
.key { position: absolute; left: var(--s4); bottom: var(--s4); font-size: var(--f-xs); color: var(--ink-3); display: flex; gap: var(--s4); flex-wrap: wrap; max-width: 60%; }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key svg { flex: none; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: var(--f-xs); padding: 4px 8px; border-radius: 4px; max-width: 320px; z-index: 5; box-shadow: var(--shadow); }

/* rules list */
table { border-collapse: collapse; width: 100%; font-size: var(--f-s); table-layout: fixed; }
col.c-scope { width: 150px; } col.c-from { width: 190px; } col.c-said { width: 64px; } col.c-last { width: 110px; } col.c-tags { width: 190px; }
th { text-align: left; font-weight: 550; color: var(--ink-3); font-size: var(--f-xs); padding: 0 var(--s3) var(--s1); white-space: nowrap; }
td { padding: 7px var(--s3); border-top: 1px solid var(--line); vertical-align: baseline; }
td.t { overflow-wrap: anywhere; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--panel); }
tr.row[aria-selected="true"] td { background: var(--accent-soft); }
tr.row.off td.t { color: var(--ink-3); }
tr.row td.t button { all: unset; cursor: pointer; display: block; width: 100%; }
tr.row td.t button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.tag { font-size: 0.6875rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; font-weight: 550; }
.tag.bad { border-color: transparent; background: var(--bad-soft); color: var(--bad); }
.tag.core { border-color: transparent; background: var(--accent-soft); color: var(--ink); }
.tags { display: flex; gap: var(--s1); justify-content: flex-end; }

/* inbox */
.item { border-top: 1px solid var(--line); padding: var(--s3) 0 var(--s4); display: grid; gap: var(--s2); }
.item q { quotes: none; font-size: var(--f-m); }
.item .proposal { font-size: var(--f-s); }
.item .meta { font-size: var(--f-xs); color: var(--ink-3); }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.actions select { max-width: 240px; }
.form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); max-width: 720px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
label { display: grid; gap: var(--s1); font-size: var(--f-xs); font-weight: 550; color: var(--ink-2); }
label .hint { font-weight: 400; color: var(--ink-3); }
.empty { color: var(--ink-2); font-size: var(--f-s); padding: var(--s4) 0; }
.problems { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: var(--s2) var(--s3); font-size: var(--f-s); margin: 0; }
.problems ul { margin: 0; padding-left: 1.1em; }

/* build */
.build { display: grid; gap: var(--s4); align-content: start; }
.build h2, .build h3, .build p { margin: 0; }
.build h3 { font-size: var(--f-s); font-weight: 650; color: var(--ink-2); margin-top: var(--s2); }
.build .lead { max-width: 80ch; margin: 0; }
.build .actions > span, .build .form [role=status] { font-size: var(--f-s); }
.result h3 { font-size: var(--f-m); color: var(--ink); margin: 0; }
.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--s3); }
.engine { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--raised); cursor: pointer; font-size: var(--f-s); color: var(--ink); font-weight: 400; transition: border-color 160ms var(--ease); }
.engine:hover { border-color: var(--ink-3); }
.engine.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.engine input { margin: 3px 0 0; accent-color: var(--accent); }
.engine > span { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); align-items: baseline; flex: 1; }
.engine b { font-weight: 650; }
.engine small { grid-column: 1 / -1; color: var(--ink-2); font-size: var(--f-xs); line-height: 1.5; }
.form.wide { max-width: none; }
.form .three { display: grid; grid-template-columns: 2fr 1fr 1.4fr; gap: var(--s3); }
.go { gap: var(--s4); }
.btn.big { padding: 9px var(--s5); font-size: var(--f-m); }
.progress { display: grid; gap: var(--s3); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.progress .step { display: flex; gap: var(--s3); align-items: baseline; }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 400ms var(--ease); }
.bar.busy i { width: 30%; animation: busy 1.4s var(--ease) infinite; }
@keyframes busy { from { translate: -100% 0; } to { translate: 340% 0; } }
.result { display: grid; gap: var(--s3); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.result ul { margin: 0; padding-left: 1.1em; }
.small { font-size: var(--f-xs); }
.note { color: var(--ink-2); font-size: var(--f-s); }

/* files */
.files { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--s5); align-items: start; }
.files ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.files li button { all: unset; cursor: pointer; display: block; padding: 6px var(--s3); border-radius: var(--r); font-size: var(--f-s); width: 100%; box-sizing: border-box; }
.files li button:hover { background: var(--panel); }
.files li button[aria-current="true"] { background: var(--accent-soft); }
.files li small { display: block; color: var(--ink-3); font-size: var(--f-xs); }
.file { display: grid; gap: var(--s3); min-width: 0; }
.file dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s1) var(--s4); font-size: var(--f-s); }
.file dt { color: var(--ink-3); white-space: nowrap; }
.file dd { margin: 0; overflow-wrap: anywhere; }
.file .path { font: 0.78rem ui-monospace, "Cascadia Mono", Consolas, monospace; }
.file dd .switch + div { margin-top: 2px; }
.credit { font-size: var(--f-xs); margin: var(--s5) 0 0; }
.file-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
pre { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); font: 0.78rem/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

/* detail */
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; min-height: 0; padding: var(--s4) var(--s5) var(--s6); display: grid; gap: var(--s4); align-content: start; }
aside .head { display: flex; align-items: center; gap: var(--s2); font-size: var(--f-xs); color: var(--ink-2); }
aside .head .spacer { flex: 1; }
aside input.title { font-size: var(--f-l); font-weight: 650; width: 100%; border-color: transparent; background: none; padding: 4px 6px; margin: 0 -6px; letter-spacing: -0.01em; }
aside input.title:hover { border-color: var(--line-strong); }
aside input.title:focus { background: var(--raised); border-color: var(--line-strong); }
.switches { display: flex; gap: var(--s4); flex-wrap: wrap; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--f-s); font-weight: 500; color: var(--ink); cursor: pointer; }
.switch input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--line-strong); position: relative; margin: 0; cursor: pointer; transition: background 160ms var(--ease); }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--raised); transition: translate 160ms var(--ease); box-shadow: 0 1px 2px oklch(0 0 0 / 0.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { translate: 12px 0; }
.facts { display: flex; gap: var(--s5); font-size: var(--f-xs); color: var(--ink-2); flex-wrap: wrap; }
.facts b { display: block; font-size: var(--f-m); color: var(--ink); font-weight: 650; }
.facts .bad b { color: var(--bad); }
.savebar { display: flex; gap: var(--s3); align-items: center; position: sticky; bottom: calc(-1 * var(--s6)); background: var(--panel); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.savebar span { font-size: var(--f-xs); color: var(--ink-2); }
aside h2.skill-name { margin: 0; overflow-wrap: anywhere; }
aside p.about { margin: 0; font-size: var(--f-s); color: var(--ink-2); }
aside li.pair { display: flex; justify-content: space-between; gap: var(--s3); }
aside h4 { font-size: var(--f-xs); font-weight: 650; color: var(--ink-2); margin: 0 0 var(--s2); }
aside ul { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: var(--f-s); }
aside ul.quotes li { color: var(--ink); }
aside ul.quotes small { display: block; color: var(--ink-3); font-size: var(--f-xs); }
aside ul.links button { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
aside ul.links button:hover { text-decoration-color: var(--ink); }
aside ul.links button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.skeleton { padding: var(--s5); display: grid; gap: var(--s3); max-width: 720px; }
.skeleton i { height: 14px; border-radius: 4px; background: var(--line); display: block; }
#lost { position: fixed; left: 50%; bottom: var(--s5); translate: -50% 0; background: var(--ink); color: var(--bg); padding: var(--s2) var(--s4); border-radius: var(--r); font-size: var(--f-s); box-shadow: var(--shadow); z-index: 10; max-width: calc(100vw - 32px); }
#lost code { font: 0.8rem ui-monospace, Consolas, monospace; }

@media (max-width: 900px) {
  main.with-detail { grid-template-columns: minmax(0, 1fr); }
  main.with-detail .view { display: none; }
  aside { border-left: 0; }
  .files { grid-template-columns: 1fr; }
  .form .two, .form .three { grid-template-columns: 1fr; }
  .pad { padding: var(--s4); }
  .where { display: none; }
  .key, .legend { display: none; }
  td.hide-s, th.hide-s, col.hide-s { display: none; }
  col.c-tags { width: 120px; }
}
@media (pointer: coarse) {
  .btn, nav button, .seg button, .legend button, input[type=text], input[type=search], input[type=password], select { min-height: 44px; }
  .icon-btn { width: 44px; height: 44px; }
  input[type=text], input[type=search], input[type=password], textarea, select { font-size: 1rem; }
  td { padding-block: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .bar.busy i { animation: none; width: 100%; opacity: 0.5; } }
</style>
</head>
<body>
<header>
  <h1>Behaviour map</h1>
  <nav id="nav" aria-label="Views"></nav>
  <label class="search"><span hidden>Search rules and skills</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search rules and skills" autocomplete="off">
  </label>
  <span class="update"><button id="update" class="btn" title="Read the new chats, look for skills again, rebuild what changed and save it to GitHub">Update</button><span id="updated" class="muted num" role="status"></span></span>
  <span id="where" class="where"></span>
</header>
<main id="main"><div class="view" id="view"><div class="skeleton"><i style="width:40%"></i><i></i><i style="width:85%"></i><i style="width:70%"></i></div></div></main>
<div id="tip" hidden></div>
<div id="lost" role="alert" hidden></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const VIEWS = [["map", "Map"], ["rules", "Rules"], ["skills", "Skills"], ["inbox", "Inbox"], ["files", "Files"], ["build", "Build"]];
const RULE_VIEWS = ["map", "rules"];            // the views in which the open panel holds a rule that stays open across them
const STATE_WORDS = { fresh: "", fading: "Fading", stale: "Stale", undated: "No date" };
let S = null, sortBy = "said", skillFilter = "all", view = "map", selected = null, profile = "all", stateFilter = "all", catFilter = null, query = "", exportName = "CLAUDE.md", exportText = "";
let draft = null, saving = false, refused = [], savedNote = "", openForm = null;

const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

    list.append(h("label", { class: "engine" + (engine === e.id ? " on" : "") },
      h("input", { type: "radio", name: "engine", value: e.id, checked: engine === e.id, onchange: () => { engine = e.id; buildProblems = []; render(); } }),
      h("span", {}, h("b", {}, e.label), h("span", { class: "tag" + (e.ready ? " core" : "") }, e.ready ? "Ready" : "Not set up"), h("small", {}, e.detail))));
  }
  pad.append(list);
  if (engine === "api") {
    const field = (key, label, hint, type) => h("label", {}, h("span", {}, label, hint ? h("span", { class: "hint" }, " " + hint) : null),
      h("input", { type: type || "text", value: engineForm[key], autocomplete: "off", spellcheck: "false", oninput: e => { engineForm[key] = e.target.value; } }));
    pad.append(h("div", { class: "form wide" },
      h("div", { class: "three" }, field("base_url", "Address", "for example http://localhost:11434/v1"), field("model", "Model", "as the server names it"),
        field("api_key", "Key", "only if the server needs one; a saved key is kept when this stays empty", "password")),
      h("div", { class: "actions" }, h("button", { class: "btn", onclick: saveEngine }, "Save and check"),
        engineNote ? h("span", { role: "status", class: "muted" }, engineNote) : null)));
  }
  if (buildProblems.length) pad.append(problems(buildProblems));
  const chosen = b.engines.find(e => e.id === engine);
  pad.append(h("div", { class: "actions go" },
    h("button", { class: "btn primary big", disabled: !chosen || !chosen.ready, onclick: startBuild }, b.last || !b.starter_only ? "Build again from my chats" : "Build my map"),
    h("span", { class: "muted" }, chosen && chosen.ready ? "Your rules so far stay. Starter rules you said yourself are rewritten in your words." : "Set up who reads your chats first.")));
  v.append(pad);
}
function result(s) {
  const box = h("div", { class: "result" }, h("h3", {}, "Your map is built"),
    h("div", { class: "facts num" }, [[s.rules, "new rule"], [s.rewritten, "starter rule in your words", "starter rules in your words"],
      [s.skills.length, "suggested skill"], [s.questions, "open question"], [s.prompts, "prompt read", "prompts read"]]
      .map(([n, one, many]) => h("div", {}, h("b", {}, String(n)), n === 1 ? one : many || one + "s"))));
  const left = Object.entries(s.left_out || {}).map(([why, n]) => (n === 1 ? "1 finding" : n + " findings") + " left out because " + why);
  if (s.failed_batches) left.push((s.failed_batches === 1 ? "1 part" : s.failed_batches + " parts") + " of your chats could not be read; build again to try once more");
  if (s.starter_kept) left.push((s.starter_kept === 1 ? "1 starter rule" : s.starter_kept + " starter rules") + " kept that you never said; switch them off in Rules if they do not fit");
  if (left.length) box.append(h("ul", { class: "muted small" }, left.map(t => h("li", {}, t))));
  const claude = ((S.exports || []).find(f => f.name === "CLAUDE.md") || { tools: [] }).tools[0];
  box.append(h("div", { class: "actions" },
    h("button", { class: "btn primary", onclick: () => { view = "map"; render(); } }, "See the map"),
    s.skills.length ? h("button", { class: "btn", onclick: () => { view = "skills"; query = ""; render(); } }, "See the suggested skills") : null,
    s.questions ? h("button", { class: "btn", onclick: () => { stateFilter = "question"; query = ""; view = "rules"; render(); } }, "See the open questions") : null,
    claude ? h("label", { class: "switch", title: "Puts the core into " + claude.target + ". Text of your own there is kept." },
      h("input", { type: "checkbox", checked: claude.live, onchange: e => { e.target.disabled = true; installTool("claude", e.target.checked ? "install" : "remove"); } }),
      claude.live ? "Claude Code uses it" : "Use it in Claude Code") : null));
  return box;
}
async function post(path, body) { const { ok, data } = await api(path, body || {}); take(data); return { ok, data }; }
async function saveEngine() {
  engineNote = "Checking the address"; render();
  const { ok, data } = await post("/api/engine", engineForm);
  engineNote = ok ? "Saved. The model answers." : ""; buildProblems = ok ? [] : data.refused || ["Not saved."];
  if (ok) engineForm.api_key = "";
  render();
}
async function startBuild() {
  buildProblems = [];
  const { ok, data } = await post("/api/build", { engine });
  if (!ok) buildProblems = data.refused || ["The build did not start."];
  render();
}
async function poll() {
  if (polling) return; polling = true;
  while (job().state === "running") {
    await new Promise(r => setTimeout(r, 1500));
    try { const { data } = await api("/api/build"); S.build = data; } catch (e) { break; }
    if (view === "build" && job().state === "running") render();
  }
  polling = false;
  try { const { data } = await api("/api/state"); take(data); } catch (e) { /* the next action loads it */ }
  render();
}

/* ---------- the page stays up while a tab shows it ---------- */
const TAB = Math.random().toString(36).slice(2, 12);
const alive = () => fetch("/api/alive?tab=" + TAB, { headers: { "X-Brain-Token": TOKEN }, cache: "no-store" }).catch(() => {});
alive(); setInterval(alive, 20000);
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye?t=" + encodeURIComponent(TOKEN) + "&tab=" + TAB));
addEventListener("pageshow", e => { if (e.persisted) alive(); });

/* ---------- start ---------- */
let updating = false, updateNote = "";
$("#update").addEventListener("click", async e => {
  if (!leaveRule()) return;
  updating = true; e.target.disabled = true; $("#updated").textContent = "reading the new chats";
  try {
    const { ok, data } = await api("/api/scan", {});
    take(data);
    updateNote = !ok ? "could not update" : (data.added ? data.added + (data.added === 1 ? " new correction" : " new corrections") : "nothing new") + (data.repo ? ", " + data.repo : "");
  } catch (err) { updateNote = ""; }
  updating = false; e.target.disabled = false; render();
  setTimeout(() => { updateNote = ""; if (S) renderTop(); }, 12000);
});
function take(data) { if (data && data.rules) { S = data; exportLoaded = null; index(); } }
$("#q").addEventListener("input", e => {
  query = e.target.value.trim();
  if (view === "map") { litIds = new Set(S.rules.filter(matches).map(r => r.id)); draw(); return; }
  if (view !== "rules" && view !== "skills") view = "rules";
  render(); $("#q").focus();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && selected && !/TEXTAREA/.test(document.activeElement.tagName)) closeRule();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
addEventListener("beforeunload", e => { if (isDirty()) e.preventDefault(); });
// the address keeps the view and the open rule, so Back and a bookmark work
function fromHash() { const [v, id] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (VIEWS.some(([x]) => x === v)) view = v; selected = id || null; if (!opened()) selected = null; }
addEventListener("hashchange", () => { if (location.hash !== hashFor() && S) { if (leaveRule()) fromHash(); render(); } });
api("/api/state").then(({ data }) => {
  take(data);
  if (!location.hash && S.build && S.build.starter_only && !S.build.last) view = "build";     // first start: one button to a map of your own
  fromHash(); render();
  if (job().state === "running") poll();
}).catch(() => {});
